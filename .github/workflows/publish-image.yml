name: Publish image

on:
  push:
    branches: [ "main" ]

# packages: write is what lets GITHUB_TOKEN push to this repository's own
# GHCR namespace (ghcr.io/alexanderthaller/trivy-web) -- no separate PAT or
# secret to manage or rotate. id-token: write is what lets `cosign sign`
# obtain a short-lived Sigstore certificate bound to this workflow's OIDC
# identity, so signing needs no key to generate or store either. Both are
# scoped to this workflow alone (nix.yml, which also runs on untrusted
# pull_request checkouts, only ever gets contents: read) rather than
# granted repo-wide.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false the same way nix.yml's checkout is:
      # nothing here pushes to git, only to the container registry.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Set up the Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Everything from here down -- cosign, trivy, skopeo, and the image
      # itself -- comes from flake.nix rather than a separately pinned
      # install step per tool: one source of truth for what versions this
      # workflow runs, the same one the image itself is built from.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short commit sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `nix build` alone would leave `result` a symlink into the store;
      # readlink resolves it to the actual store path so later steps do not
      # each have to re-derive it.
      - name: Build the image
        id: build
        run: |
          nix build '.#image'
          echo "archive=$(readlink -f result)" >> "$GITHUB_OUTPUT"

      # Every tag this push lands on is named here explicitly: a moving
      # `latest` and an immutable `sha-<short-sha>` a rollback can pin to.
      # skopeo copies straight from the Nix-built docker-archive tarball,
      # no `docker load` in between.
      - name: Push the image
        run: |
          nix run nixpkgs#skopeo -- copy \
            "docker-archive:${{ steps.build.outputs.archive }}" \
            "docker://ghcr.io/alexanderthaller/trivy-web:sha-${{ steps.sha.outputs.short }}"
          nix run nixpkgs#skopeo -- copy \
            "docker-archive:${{ steps.build.outputs.archive }}" \
            "docker://ghcr.io/alexanderthaller/trivy-web:latest"

      # Resolved from the registry right after the push, not computed
      # locally beforehand: a local digest (from the docker-archive tarball,
      # or from skopeo's own --digestfile) does not reliably match what the
      # registry ends up serving back for the same content -- confirmed
      # against a throwaway local registry, where the two disagreed on every
      # attempt. Reading the sha tag back immediately after pushing it is
      # the one thing every consumer -- cosign, trivy, a puller -- resolves
      # to the same answer, and it carries no race-condition risk cosign's
      # own "sign by tag" warning is about: this tag is unique to this
      # build and nothing else ever pushes to it.
      - name: Resolve the pushed digest
        id: image
        run: |
          digest=$(nix run nixpkgs#skopeo -- inspect \
            "docker://ghcr.io/alexanderthaller/trivy-web:sha-${{ steps.sha.outputs.short }}" \
            --format '{{.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless: no `--key`, so cosign looks for the ambient GitHub Actions
      # OIDC token (from id-token: write above) and gets a short-lived
      # Fulcio certificate for it instead. Signs by digest, per cosign's own
      # advice, not by either mutable tag just pushed.
      - name: Sign the image
        run: |
          nix run nixpkgs#cosign -- sign --yes \
            "ghcr.io/alexanderthaller/trivy-web@${{ steps.image.outputs.digest }}"

      # SPDX, matching the format trivy-web's own SBOM display already
      # parses (see SbomDocument::Spdx in src/handler/cosign.rs) -- so the
      # image can show its own SBOM through its own feature. Scans the
      # image that was just pushed, by digest: what's attached should
      # describe what a puller actually gets, not the local build tree.
      #
      # `cosign attach sbom` is itself deprecated in favor of SBOM
      # attestations, but still writes the same digest.sbom tag scheme this
      # app's cosign_manifest reads -- the modern replacement does not, and
      # switching to it would make the SBOM display invisible to this app's
      # own webinterface. Revisit if cosign drops the deprecated command
      # entirely.
      - name: Generate and attach the SBOM
        run: |
          nix run nixpkgs#trivy -- image --format spdx-json --output sbom.spdx.json \
            "ghcr.io/alexanderthaller/trivy-web@${{ steps.image.outputs.digest }}"
          nix run nixpkgs#cosign -- attach sbom --type spdx --sbom sbom.spdx.json \
            "ghcr.io/alexanderthaller/trivy-web@${{ steps.image.outputs.digest }}"
