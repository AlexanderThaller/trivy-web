name: Nix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest

    steps:
      # See bazel.yml for why persist-credentials is off.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Set up the Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Builds both packages flake.nix exposes: trivy-web itself, and the
      # container image built from it. Read-only, no registry credentials
      # needed for either -- pushing the image is publish-image.yml's job,
      # gated to pushes on main. This is here so a flake.nix change that
      # breaks the build (or a Cargo.lock change that changes what
      # cargoLock.lockFile has to vendor) is caught on every PR rather than
      # only surfacing when publish-image.yml next runs against main.
      - name: Build trivy-web and the container image
        run: nix build '.#trivy-web' '.#image'
