[package]
name = "trivy-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
# Enable/Disable CI-specific tests
ci = []

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env", "cargo"] }
docker-registry-client = "0.4.1"
eyre = "0.6"
fred = { version = "10", features = ["i-keys"], default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Fetches a URL-hosted cosign public key (the scan form's "https://…" form of
# the key field). Already in the tree through `sigstore` with exactly this
# feature set, so this is a direct dependency on it, not a second HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Signature verification -- keyless (chain of trust to Sigstore's Fulcio
# root, signature validity, Rekor bundle) and against a supplied public key
# alike -- without shelling out to the cosign binary, which is what keeps it
# out of the container image. `cosign`/`rekor` bring the verification logic
# itself; `sigstore-trust-root` fetches Sigstore's public trust root over
# TUF; `rustls-tls` matches the TLS backend the rest of this crate uses
# instead of pulling in native-tls too.
sigstore = { version = "0.14", default-features = false, features = [
  "cosign",
  "rekor",
  "rustls-tls",
  "sigstore-trust-root",
] }
tokio = { version = "1", features = ["full", "tracing"] }
topcoat = { version = "0.8", default-features = false, features = [
  "compression",
  "discover",
  "router",
  "serve",
  "view",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
x509-parser = "0.18"
# `override` makes mimalloc define malloc/free themselves, so the C in the
# tree (aws-lc's OPENSSL_malloc, most of all) allocates through it too rather
# than through musl's allocator, which is what the static build would
# otherwise link in for those callers. Verified on the unstripped binary:
# malloc/free/calloc/realloc are aliases of their mi_ counterparts and
# musl's allocator internals are absent.
mimalloc = { version = "0.1", features = ["override"] }

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
#missing-docs = "warn"
missing-debug-implementations = "warn"
rust-2018-idioms = "warn"
unsafe-code = "forbid"
unused-lifetimes = "warn"

[lints.clippy]
allow-attributes = "warn"
allow-attributes-without-reason = "warn"
dbg-macro = "warn"
pedantic = "warn"
todo = "warn"
unwrap-used = "warn"

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
# No `strip` here: the binary that ships is built by Nix, whose cargo build
# hook overrides the profile's strip setting with its own fixup phase --
# see `stripAllList` in flake.nix, which is where the symbol table comes off.
