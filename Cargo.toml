[package]
name = "trivy-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
# Enable/Disable CI-specific tests
ci = []

[dependencies]
# Decodes the base64 payload of the DSSE envelopes VEX attestations are
# published in (see `src/handler/vex/attestation.rs`). Already in the tree
# through `sigstore`, so this is a direct dependency on a crate that is built
# either way rather than a new one.
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env", "cargo"] }
eyre = "0.6"
fred = { version = "10", features = ["i-keys"], default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Fetches a URL-hosted cosign public key (the scan form's "https://…" form of
# the key field). Already in the tree through `sigstore` with exactly this
# feature set, so this is a direct dependency on it, not a second HTTP stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Signature verification -- keyless (chain of trust to Sigstore's Fulcio
# root, signature validity, Rekor bundle) and against a supplied public key
# alike -- without shelling out to the cosign binary, which is what keeps it
# out of the container image. `cosign`/`rekor` bring the verification logic
# itself; `sigstore-trust-root` fetches Sigstore's public trust root over
# TUF; `rustls-tls` matches the TLS backend the rest of this crate uses
# instead of pulling in native-tls too.
sigstore = { version = "0.14", default-features = false, features = [
  "cosign",
  "rekor",
  "rustls-tls",
  "sigstore-trust-root",
] }
tokio = { version = "1", features = ["full", "tracing"] }
topcoat = { version = "0.9", default-features = false, features = [
  "compression",
  "discover",
  "router",
  "serve",
  "view",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
x509-parser = "0.18"
# The allocator itself is every target's; see the two target sections at the
# bottom for why `override` is not.
mimalloc = { version = "0.1" }
# Every registry request that is not a scanner's: manifests, blobs and
# referrers, anonymously or with the credentials a scan was submitted with.
# Already in the tree through `sigstore`, which verifies signatures with it,
# so this is the same client rather than a second one; `rustls-tls` for the
# same reason sigstore gets it.
# The registry credentials a scan is submitted with, from the form to the
# registry client: redacted in every `Debug` they pass through, and zeroed
# when they are dropped.
secrecy = { version = "0.10", features = ["serde"] }
oci-client = { version = "0.17", default-features = false, features = [
  "rustls-tls",
] }

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
#missing-docs = "warn"
missing-debug-implementations = "warn"
rust-2018-idioms = "warn"
unsafe-code = "forbid"
unused-lifetimes = "warn"

[lints.clippy]
allow-attributes = "warn"
allow-attributes-without-reason = "warn"
dbg-macro = "warn"
pedantic = "warn"
todo = "warn"
unwrap-used = "warn"

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
# No `strip` here: the binary that ships is built by Nix, whose cargo build
# hook overrides the profile's strip setting with its own fixup phase --
# see `stripAllList` in flake.nix, which is where the symbol table comes off.

# `override` has mimalloc define malloc/free and friends as strong symbols in
# the executable, so that the C in the tree -- aws-lc's OPENSSL_malloc, most of
# all -- allocates through it too rather than through whatever allocator would
# otherwise be linked in for those callers. That was worked out for, and
# verified on, the statically linked musl binary the image ships: one link unit,
# no libc of its own, nothing else in the process that could have handed out a
# pointer. Verified on the unstripped binary at the time: malloc/free/calloc/
# realloc are aliases of their mi_ counterparts and musl's allocator internals
# are absent.
#
# None of that holds for a dynamically linked build against a system libc, where
# interposing those symbols means libc and mimalloc each hand out pointers the
# other may be asked to free, and freeing a foreign pointer in a release
# mimalloc is undefined -- a SIGSEGV with nothing written anywhere, which is
# not a thing a scan should be able to do to this process. So the interposition
# is confined to the target it was established on, and everywhere else the
# global allocator is mimalloc for Rust's own allocations and libc keeps its
# own. What that costs is aws-lc allocating through the system allocator on
# those targets, which is where it would have allocated anyway.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", features = ["override"] }
