[package]
name = "trivy-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
# Enable/Disable CI-specific tests
ci = []

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env", "cargo"] }
docker-registry-client = "0.4.1"
eyre = "0.6"
fred = { version = "10", features = ["i-keys"], default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Keyless-signature verification (chain of trust to Sigstore's Fulcio root,
# signature validity, Rekor bundle) without shelling out to the cosign
# binary. `cosign`/`rekor` bring the verification logic itself;
# `sigstore-trust-root` fetches Sigstore's public trust root over TUF;
# `rustls-tls` matches the TLS backend the rest of this crate uses instead of
# pulling in native-tls too.
sigstore = { version = "0.14", default-features = false, features = [
  "cosign",
  "rekor",
  "rustls-tls",
  "sigstore-trust-root",
] }
tokio = { version = "1", features = ["full", "tracing"] }
topcoat = { version = "0.8", default-features = false, features = [
  "compression",
  "discover",
  "router",
  "serve",
  "view",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
x509-parser = "0.18"
mimalloc = "0.1"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
#missing-docs = "warn"
missing-debug-implementations = "warn"
rust-2018-idioms = "warn"
unsafe-code = "forbid"
unused-lifetimes = "warn"

[lints.clippy]
allow-attributes = "warn"
allow-attributes-without-reason = "warn"
dbg-macro = "warn"
pedantic = "warn"
todo = "warn"
unwrap-used = "warn"

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
